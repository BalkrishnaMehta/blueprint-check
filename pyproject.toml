[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-check"
version = "0.1.0"
description = "Diff an architecture diagram against a Graphify dependency graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "google-genai>=1.0",
  "rich>=13",
  "pillow>=10",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blueprint = "blueprint.cli:main"
blueprint-api = "blueprint.api:serve"

[tool.setuptools.packages.find]
include = ["blueprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
