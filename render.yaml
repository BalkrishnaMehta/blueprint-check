services:
  - type: web
    name: blueprint-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install .
    startCommand: uvicorn blueprint.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: blueprint-web
    runtime: node
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_URL
        fromService:
          name: blueprint-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
