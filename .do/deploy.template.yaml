spec:
  name: blueprint
  region: blr

  services:
    - name: api
      git:
        repo_clone_url: https://github.com/BalkrishnaMehta/blueprint-check.git
        branch: main
      dockerfile_path: Dockerfile
      http_port: 8000
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      health_check:
        http_path: /health
      envs:
        - key: CORS_ORIGINS
          scope: RUN_TIME
          value: ${web.PUBLIC_URL}

    - name: web
      git:
        repo_clone_url: https://github.com/BalkrishnaMehta/blueprint-check.git
        branch: main
      source_dir: /web
      environment_slug: node-js
      build_command: npm ci && npm run build
      run_command: npm start
      http_port: 8080
      instance_size_slug: apps-s-1vcpu-0.5gb
      instance_count: 1
      health_check:
        http_path: /
      envs:
        - key: NEXT_PUBLIC_API_URL
          scope: RUN_AND_BUILD_TIME
          value: ${api.PUBLIC_URL}
